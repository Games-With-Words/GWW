<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Games With Words — The room is the game.</title>
  <meta name="description" content="Private-room party games for the friends and family already sitting next to you. One person starts a room, everyone scans in, then the stories begin." />
  <link rel="canonical" href="https://games-with-words.com/" />

  <!-- THE SHARE CARD.
       Rendered from og-card.html in the games' own vendored type — the wordmark
       in Archivo 900, and anything a player would have typed in Martian Mono —
       because a share preview of a word game should show the words. It previews
       a live round rather than describing the app: three anonymized answers with
       "which one was written blind?" left unanswered, next to a real Say Less
       clue. Absolute URL: scrapers do not resolve relative paths. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Games With Words" />
  <meta property="og:url" content="https://games-with-words.com/" />
  <meta property="og:title" content="Games With Words — The room is the game." />
  <meta property="og:description" content="Say Less and Ghost Writer. Private rooms, no accounts, no strangers — just your circle and some very questionable answers." />
  <meta property="og:image" content="https://games-with-words.com/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Games With Words — three anonymous answers, one written by a player who never saw the question." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Games With Words — The room is the game." />
  <meta name="twitter:description" content="One of you never saw the question. Which answer was written blind?" />
  <meta name="twitter:image" content="https://games-with-words.com/og.jpg" />
  <!-- Fonts are VENDORED, not fetched. A stack that synthesizes its own score
       from oscillators to avoid a CDN should not render its own name through
       one. Two variable files, self-hosted, ~180KB total, replacing three
       remote families — and the board works on a TV with no DNS. -->
  <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
